name: knn-donut
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - numpy
  - toolz
  - matplotlib
  - pandas
  - cudatoolkit
  - scikit-learn
  - pytorch-lightning
  - timm=0.5.4
  - transformers
  - protobuf
  - nltk
  - pip:
      - donut-python
      - sconf
      - zss
      - tensorboard
      - tensorboardX
      - torch
      - torchvision
      - datasets